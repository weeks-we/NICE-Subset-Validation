extends: legacy.yaml
schedule: verified-selection
model:
  id: Qwen/Qwen3.8-27B
  loader: AutoModelForImageTextToText
  reuse_base_for_inference: true
  selective_logits: true
data:
  validation_id: SWE-bench/SWE-bench_Verified
  validation_kind: swebench
  validation_split: test
  smith_id: SWE-bench/SWE-smith
  smith_revision: null
  smith_path: data/smith_tasks.jsonl
experiment:
  design: verified-selection-v1
  candidates: 2000
  validation: 20
  sft_validation: 100
  benchmark: 100
  rollouts: 8
  subset_size: 512
  seeds: [11]
  groups: [low, high]
  strata: halves
training:
  learning_rate: 1.0e-6
  learning_rates: [1.0e-6, 5.0e-6]
  checkpoints: [0.25, 0.5, 1.0]
  effective_batch: 8
  micro_batch_size: auto
  micro_batch_candidates: [1, 2, 4]
score:
  parallel: true
  parallel_check_atol: 1.0e-6
  parallel_check_rtol: 1.0e-4
agent:
  tasks_per_gpu: 2
  max_actions: 75
  max_new_tokens: 32768
  total_new_tokens: 262144
  context_length: 131072
  context_budget_policy: available
  history_observations: 5
  budget_exhaustion_policy: grade_patch
  wall_seconds: 3600
  tool_seconds: 300
  evaluation_timeout: 3600
transfer:
  enabled: false
