extends: main.yaml
# Default server target: 8 x NVIDIA H200; adjust to the actual authorized hardware.
# Use scripts/run_server.py --num-gpus N (default 8) for one training GPU plus N-1 services.
# This manual example is a single training role; generated service configs bind other GPUs.
# Scoring and training remain single-GPU; this is not 8-way DDP/TP/FSDP.
execution: server
output: runs/main
model:
  # Replace these after inspecting the official model config and named_modules.
  path: /srv/models/Qwen3.8-27B
  tokenizer_path: /srv/models/Qwen3.8-27B
  revision: REPLACE_WITH_40_HEX_COMMIT
  loader: AutoModelForImageTextToText
  gpu_uuids: [REPLACE_WITH_FULL_GPU_UUID]
  adapter_path: runs/initial_adapter
agent:
  # Map instance_id -> a clean task image at base_commit, WITHOUT hidden tests.
  image_map: data/task_images.json
  image_revision_lock: data/task_images.lock.json
  smoke_task_path: data/development_task.json
  swebench_revision: REPLACE_WITH_40_HEX_OFFICIAL_COMMIT
  swesmith_revision: REPLACE_WITH_40_HEX_SWESMITH_COMMIT
