# Independent evaluation deployment plan; never merge into the old snapshot.
schema_version: 1
execution: server
vllm_version: 0.22.0
claude_code_version: 2.1.153  # Public compatibility reports; still requires real server acceptance.
agent_interface: claude_agent_sdk
claude_agent_sdk_version: 0.2.87
claude_runtime_path: /opt/nice-sdk/bin/claude-pinned
models: [initial, low_lr1_p100, low_lr2_p025, high_lr1_p050, high_lr2_p100]
scopes: {benchmark: 100, nice_retest: 20}
generation:
  thinking: true
  preserve_thinking: true
  reasoning_effort: xhigh  # Qwen template/backend setting, not an assumed Claude effort mapping.
  temperature: 1.0
  top_p: 0.95
  top_k: 20
  min_p: 0.0
  presence_penalty: 0.0
  repetition_penalty: 1.0
  context_length: 262144
  max_new_tokens: 32768
agent:
  max_turns: 250
  wall_seconds: 7200
  total_output_tokens: 262144
  tool_seconds: 1200
  grading_seconds: 3600
  tools: [Bash, Read, Edit, Write, Glob, Grep]
  context_management: claude_native
  disable_subagents: true
  submit_nonempty_patch_on_budget_stop: true
  infrastructure_retries: 2
  model_failure_retries: 0
resources:
  gpu_count: 8
  tensor_parallel_size: 1
  slots_per_service: 4  # 32 simultaneous agent episodes on eight TP1 services; gated at full context.
network:
  endpoint: null  # Actual container-reachable Anthropic-compatible root URL.
  docker_network: null  # Existing dedicated network, NOT host/none/default bridge.
  endpoint_host_is_private: null  # Determined by preflight, not assumed from DNS name.
  egress_policy_evidence: null  # Platform network policy/firewall receipt, outside Git.
acceptance:
  logprob_atol: 0.15  # BF16 HF/vLLM top-20 logprob absolute tolerance, frozen before benchmark.
  required_before_formal: true
  sdk_file_tool_smoke: true
  all_five_adapter_routes: true
  verify_effective_generation_parameters: true
  verify_hf_vllm_adapter_numerics: true
  verify_context_and_output_capacity: true
  official_development_task_grade: true
  stop_on_failure: true
  # These are required acceptance items, not claims they already passed.
